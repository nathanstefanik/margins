[package]
name = "margins"
version.workspace = true
description = "Minimal EPUB reader with file-based, AI-friendly annotations"
authors = ["Margins contributors"]
edition = "2021"
license.workspace = true

[lib]
name = "margins_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
margins-core = { path = "../crates/margins-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
dotenvy = "0.15"
