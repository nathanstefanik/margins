[package]
name = "marginalia"
version = "0.1.0"
description = "Minimal EPUB reader with file-based, AI-friendly annotations"
authors = ["Marginalia contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "marginalia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
zip = "2"
quick-xml = { version = "0.37", features = ["serialize"] }
regex = "1"
dotenvy = "0.15"
dirs = "6"
thiserror = "2"
walkdir = "2"
