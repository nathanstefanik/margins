name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: Build and test
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Run the Swift Testing suite
        run: swift test --package-path apple

      - name: Build the iOS app for the simulator
        # Compiles the app scenes (apple/ios/Margins), which the SwiftPM
        # package build above never touches. No signing on runners. The
        # generic destination builds both simulator slices (arm64 + x86_64;
        # ZIPFoundation is pure Swift, so there is no per-arch FFI library
        # to miss).
        run: make ios-build
