name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal DMG
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify tag matches package version
        run: |
          version=$(tr -d '[:space:]' < apple/VERSION)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match apple/VERSION $version" >&2
            exit 1
          fi

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Build universal app bundle
        run: make app-universal

      - name: Package DMG
        run: |
          version=${GITHUB_REF_NAME#v}
          hdiutil create -volname Margins -srcfolder build/Margins.app \
            -ov -format UDZO "Margins-v${version}.dmg"

      - name: Generate SHA256SUMS.txt
        run: |
          shasum -a 256 Margins-v*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Published from the build job on purpose: passing the DMG through
      # actions/upload-artifact burned the account's artifact storage quota
      # even though this repo kept no artifacts. No artifacts, no quota.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Margins-${{ github.ref_name }}.dmg
            SHA256SUMS.txt
          generate_release_notes: true
