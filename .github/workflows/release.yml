name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal DMG
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        run: |
          version=$(tr -d '[:space:]' < apple/VERSION)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match apple/VERSION $version" >&2
            exit 1
          fi

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Build universal app bundle
        run: make app-universal

      - name: Package DMG
        run: |
          version=${GITHUB_REF_NAME#v}
          hdiutil create -volname Margins -srcfolder build/Margins.app \
            -ov -format UDZO "Margins-v${version}.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Margins-v*.dmg
          if-no-files-found: error

  release:
    name: Attach artifacts to GitHub Release
    needs: [macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum -- * > /tmp/SHA256SUMS.txt
          mv /tmp/SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
