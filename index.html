<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margins</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">margins</div>
        <div class="topbar-actions">
          <button id="btn-library" class="ghost" title="Library (l)">library</button>
          <button id="btn-search" class="ghost" title="Search notes (/)">search</button>
          <button id="btn-import" class="ghost" title="Import EPUB (o)">import</button>
          <button id="btn-export" class="ghost" title="Export library (E)">export</button>
          <button id="btn-set-root" class="ghost" title="Choose library directory (R)">directory</button>
        </div>
        <div id="status" class="status"></div>
      </header>

      <div id="import-progress" class="operation-progress hidden" role="status" aria-live="polite">
        <div class="operation-progress-header">
          <span id="import-progress-label">Importing EPUB</span>
          <span id="import-progress-percent">0%</span>
        </div>
        <progress id="import-progress-bar" max="100" value="0" aria-label="EPUB import progress">
          0%
        </progress>
      </div>

      <div id="library-view" class="panel hidden">
        <div class="panel-header">
          <h2>Library</h2>
          <span id="library-root" class="muted"></span>
        </div>
        <ul id="book-list" class="book-list"></ul>
      </div>

      <div id="reader-view" class="reader-layout hidden">
        <aside class="chapter-sidebar">
          <div class="chapter-sidebar-header">
            <button id="btn-all-notes" class="ghost" title="All notes (N)">all notes</button>
          </div>
          <div id="chapter-list"></div>
        </aside>
        <main id="reader-pane" class="reader-pane" tabindex="0"></main>
        <aside id="notes-pane" class="notes-pane">
          <div class="notes-header">
            <h3 id="notes-title">Chapter notes</h3>
            <span id="word-count" class="muted">0 words</span>
          </div>
          <textarea
            id="notes-editor"
            spellcheck="true"
            placeholder="What stood out? Questions, reactions, and ideas worth returning to…"
          ></textarea>
          <div class="notes-footer">
            <button id="btn-save-note" class="primary">Save (:w)</button>
          </div>
        </aside>
      </div>

      <div id="notes-view" class="panel notes-page hidden">
        <div class="panel-header">
          <h2 id="notes-page-title">Notes</h2>
          <div class="notes-page-actions">
            <div class="notes-view-toggle">
              <button id="btn-notes-outline" class="ghost" title="Outline view (t)">outline</button>
              <button id="btn-notes-contents" class="ghost active" title="Contents view (t)">contents</button>
            </div>
            <button id="btn-copy-notes" class="ghost">copy all</button>
            <button id="btn-export-notes" class="ghost">export .md</button>
          </div>
        </div>
        <div id="notes-page-stats" class="muted"></div>
        <ul id="notes-page-outline" class="notes-outline hidden"></ul>
        <div id="notes-page-body"></div>
      </div>

      <footer class="keybar">
        <span><kbd>j</kbd>/<kbd>k</kbd> scroll</span>
        <span><kbd>n</kbd>/<kbd>p</kbd> chapter</span>
        <span><kbd>i</kbd> notes</span>
        <span><kbd>N</kbd> all notes</span>
        <span><kbd>t</kbd> outline</span>
        <span><kbd>/</kbd> search</span>
        <span><kbd>Esc</kbd> reader</span>
        <span><kbd>l</kbd> library</span>
        <span><kbd>R</kbd> library directory</span>
        <span><kbd>:</kbd> command</span>
      </footer>

      <div id="command-bar" class="command-bar hidden">
        <span class="prompt">:</span>
        <input id="command-input" type="text" autocomplete="off" spellcheck="false" />
      </div>

      <div id="search-overlay" class="search-overlay hidden">
        <div class="search-box">
          <div class="search-bar">
            <span class="prompt">/</span>
            <input
              id="search-input"
              type="text"
              placeholder="search notes"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <ul id="search-results" class="search-results"></ul>
        </div>
      </div>
    </div>
  </body>
</html>
