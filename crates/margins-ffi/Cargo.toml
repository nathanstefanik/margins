[package]
name = "margins-ffi"
version.workspace = true
description = "UniFFI bindings to margins-core"
edition = "2021"
license.workspace = true

[lib]
name = "margins_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
margins-core = { path = "../margins-core" }
thiserror = "2"
uniffi = { version = "0.29", features = ["cli"] }
