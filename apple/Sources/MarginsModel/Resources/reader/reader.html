<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Device-width layout: without this, iPhone renders the page at the
     980px default viewport and scales it down, shrinking every px-based
     size (the text ladder) and the fixed page margins. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reader</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #f4f1ea;
    color: #111;
  }
  /* One class per paper, set before first paint by the inline script
     below and toggled at runtime by readerSetTheme in reader.js. These
     hexes mirror ReaderPalette.swift — ReaderResourceTests keeps them
     equal. */
  html.reader-light, html.reader-light body {
    background: #f4f1ea;
    color: #111111;
  }
  html.reader-sepia, html.reader-sepia body {
    background: #efe6d2;
    color: #2e2519;
  }
  html.reader-dark, html.reader-dark body {
    background: #1b1a18;
    color: #e6e2da;
  }
  html.reader-night, html.reader-night body {
    background: #0f0e0d;
    color: #a9a398;
  }
  /* Passage highlights live in the view's annotation pane — this outer
     document, not a section — so their look is a rule here driven by the
     --margins-hl-* variables reader.js sets per paper. The :root values
     are the light-paper fallback until reader.js lands. */
  :root {
    --margins-hl-fill: rgba(255, 213, 79, 0.45);
    --margins-hl-blend: multiply;
  }
  g.margins-highlight, g.margins-reveal {
    fill: var(--margins-hl-fill);
    fill-opacity: 1;
    mix-blend-mode: var(--margins-hl-blend);
  }
  /* Uncapped reading container: the desktop layout resolves the viewer's
     width from this element, never from the capped viewer itself, so the
     ResizeObserver cannot see its own output. */
  #page {
    height: 100%;
  }
  #viewer {
    height: 100%;
    box-sizing: border-box;
    /* Fixed page margins, not insets: body text clears the running
       header (chapter title) and footer (page number) that overlay the
       paper, and showing controls never reflows the page. */
    padding: 2.2rem 1.4rem 2.0rem;
  }
  /* Desktop (macOS) spacing: 24 CSS px insets, replaced at runtime by
     readerApplyPageLayout once the viewport and font are measured. */
  html.reader-macos #viewer {
    padding: 24px;
  }
  pre.reader-error {
    margin: 2rem;
    white-space: pre-wrap;
    font-family: ui-monospace, monospace;
    font-size: 12px;
  }
</style>
<!-- Applied before the body renders so a dark session never flashes cream;
     readerSetTheme (reader.js) owns the runtime switch. -->
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var theme = params.get("theme");
    if (/^(light|sepia|dark|night)$/.test(theme)) {
      document.documentElement.classList.add("reader-" + theme);
      document.documentElement.style.colorScheme =
        theme === "dark" || theme === "night" ? "dark" : "light";
    }
    // Desktop spacing is a URL opt-in so iOS keeps its own padding.
    if (params.get("platform") === "macos") {
      document.documentElement.classList.add("reader-macos");
    }
  })();
</script>
<script src="jszip.min.js"></script>
<script src="epub.min.js"></script>
</head>
<body>
  <div id="page"><div id="viewer"></div></div>
  <script src="reader.js"></script>
</body>
</html>
