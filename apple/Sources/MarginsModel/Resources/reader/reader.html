<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Device-width layout: without this, iPhone renders the page at the
     980px default viewport and scales it down, shrinking every px-based
     size (the text ladder) and the fixed page margins. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reader</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #f4f1ea;
    color: #111;
  }
  /* Dark reading theme. The class is set before first paint by the inline
     script below and toggled at runtime by readerSetTheme in reader.js. */
  html.reader-dark, html.reader-dark body {
    background: #1b1a18;
    color: #e6e2da;
  }
  /* Uncapped reading container: the desktop layout resolves the viewer's
     width from this element, never from the capped viewer itself, so the
     ResizeObserver cannot see its own output. */
  #page {
    height: 100%;
  }
  #viewer {
    height: 100%;
    box-sizing: border-box;
    /* Fixed page margins, not insets: body text clears the running
       header (chapter title) and footer (page number) that overlay the
       paper, and showing controls never reflows the page. */
    padding: 2.2rem 1.4rem 2.0rem;
  }
  /* Desktop (macOS) spacing: 24 CSS px insets, replaced at runtime by
     readerApplyPageLayout once the viewport and font are measured. */
  html.reader-macos #viewer {
    padding: 24px;
  }
  pre.reader-error {
    margin: 2rem;
    white-space: pre-wrap;
    font-family: ui-monospace, monospace;
    font-size: 12px;
  }
</style>
<!-- Applied before the body renders so a dark session never flashes cream;
     readerSetTheme (reader.js) owns the runtime switch. -->
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    if (params.get("theme") === "dark") {
      document.documentElement.classList.add("reader-dark");
      document.documentElement.style.colorScheme = "dark";
    }
    // Desktop spacing is a URL opt-in so iOS keeps its own padding.
    if (params.get("platform") === "macos") {
      document.documentElement.classList.add("reader-macos");
    }
  })();
</script>
<script src="jszip.min.js"></script>
<script src="epub.min.js"></script>
</head>
<body>
  <div id="page"><div id="viewer"></div></div>
  <script src="reader.js"></script>
</body>
</html>
